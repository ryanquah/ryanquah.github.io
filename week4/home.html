<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="css/home-css.css">
</head>


<body>
    <div class="wrap">
        <div class="top">
            <img src="images/positivus.jpg" alt="Positivus" class="logo">
            <div class="navigation">
                <p class="text"> About us </p>
                <p class="text"> Services </p>
                <p class="text"> Use Cases </p>
                <p class="text"> Pricing </p>
                <p class="text"> Blog </p>
                <p class="text border"> Request a quote</p>
            </div>
            <div class="hamburger"><img src="images/burger.svg" width="40" alt="Menu"></div>
        </div>

        <div class="middle">
            <div class="bigtext">
                <h2 class="title">Navigating the digital landscape for success</h2>
                <p class="side"> Our digital marketing agency helps businesses grow and succeed online through a range
                    of services including SEO, PPC, social media marketing, and content creation.</p>

                <p class="button"> Book a consultation</p>
            </div>

            <img src="images/illustration.jpg" alt="Illustration of a digital marketing speaker" class="draw">
        </div>

        <div class="bottom">
            <img src="images/amazon.jpg" alt="Amazon" width="110" class="pic">
            <img src="images/dribble.jpg" alt="Dribbble" width="110" class="pic">
            <img src="images/hubspot.jpg" alt="HubSpot" width="110" class="pic">
            <img src="images/notion.jpg" alt="Notion" width="110" class="pic">
            <img src="images/netflix.jpg" alt="Netflix" width="110" class="pic">
            <img src="images/zoom.jpg" alt="Zoom" width="110" class="pic">
        </div>
    </div>
</body>

</html>
