<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Bar</title>
    <link rel="stylesheet" href="css/menu-css.css">
</head>

<body>
    <div class="menu">

        <div class="left">
            <img src="images/elementra.png" width="150" alt="Elementra-icon">
        </div>

        <div class="middle">
            <p class="text"> Home </p>
            <p class="text"> Services </p>
            <p class="text"> Work </p>
            <p class="text"> Project Details </p>
            <p class="text"> Contact </p>

        </div>

        <div class="right">
            <img src="images/phoneicon.png" width="20" alt="Phone-icon">
            <p class="phone"> 555-123-4567 </p>
            <button class="cbutton"> Contact </button>


        </div>

        <div class="hamburger"><img src="images/burger.svg" alt="Menu"></div>
    </div>
</body>

</html>
